[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ca-analyzer"
version = "0.1.0"
description = "CA: an OS source analysis tool. Real compile args -> Clang AST -> CFG/data-flow -> database."
requires-python = ">=3.11"
dependencies = [
  "clang==18.1.8",
  "libclang==18.1.1",
  "duckdb==1.5.6",
]

[project.scripts]
ca = "ca.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.package-data]
"ca.store" = ["schema.sql"]
"ca.ui" = [
  "static/*.js",
  "static/*.css",
  "static/*.html",
  "static/*.svg",
]
